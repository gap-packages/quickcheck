abstract: |
    The <span class="pkgname">QuickCheck</span> package provides property-based testing for GAP. It lets users easily test that a function always passes (or two functions return the same value) on many randomly generated inputs. The package can generate many types of GAP objects. Small inputs are tried first, so the first counterexample found is usually small.

status: dev
doc-html: doc/chap0.html
doc-pdf: doc/manual.pdf
keywords: |
    testing, property-based testing, randomised testing, QuickCheck.
